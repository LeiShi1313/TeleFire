services:
  ai:
    build:
      context: .
    container_name: telefire-ai
    command: ["python", "-m", "telefire.cli", "telegram", "ai", "--account", "default"]
    environment:
      PYTHONPATH: /app/src
      HOME: /telefire-data
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEFIRE_PI_URL: http://pi-agent:8790
      TELEFIRE_PI_TOKEN: ${TELEFIRE_PI_TOKEN}
      TELEFIRE_PI_RUN_TIMEOUT: ${TELEFIRE_PI_RUN_TIMEOUT:-300}
      TELEFIRE_HINDSIGHT_URL: http://memory-api:8888
      TELEFIRE_HINDSIGHT_TIMEOUT: ${TELEFIRE_HINDSIGHT_TIMEOUT:-90}
      TELEFIRE_MEMORY_DREAM_LOOKBACK_HOURS: ${TELEFIRE_MEMORY_DREAM_LOOKBACK_HOURS:-24}
      TELEFIRE_MEMORY_DREAM_OVERLAP_SECONDS: ${TELEFIRE_MEMORY_DREAM_OVERLAP_SECONDS:-600}
      TELEFIRE_MEMORY_DREAM_SETTLEMENT_SECONDS: ${TELEFIRE_MEMORY_DREAM_SETTLEMENT_SECONDS:-30}
      TELEFIRE_MEMORY_DREAM_MAX_MESSAGES: ${TELEFIRE_MEMORY_DREAM_MAX_MESSAGES:-500}
      TELEFIRE_MEMORY_DREAM_MAX_THREAD_MESSAGES: ${TELEFIRE_MEMORY_DREAM_MAX_THREAD_MESSAGES:-100}
      TELEFIRE_MEMORY_DREAM_SESSION_IDLE_SECONDS: ${TELEFIRE_MEMORY_DREAM_SESSION_IDLE_SECONDS:-900}
      TELEFIRE_MEMORY_DREAM_SESSION_MAX_SPAN_SECONDS: ${TELEFIRE_MEMORY_DREAM_SESSION_MAX_SPAN_SECONDS:-3600}
      TELEFIRE_MEMORY_DREAM_SESSION_MAX_EVENTS: ${TELEFIRE_MEMORY_DREAM_SESSION_MAX_EVENTS:-30}
      TELEFIRE_MEMORY_DREAM_SESSION_MAX_CHARS: ${TELEFIRE_MEMORY_DREAM_SESSION_MAX_CHARS:-4000}
      TELEFIRE_MEMORY_DREAM_RETAIN_CONCURRENCY: ${TELEFIRE_MEMORY_DREAM_RETAIN_CONCURRENCY:-4}
      TELEFIRE_MEMORY_DREAM_PREPROCESS_CONCURRENCY: ${TELEFIRE_MEMORY_DREAM_PREPROCESS_CONCURRENCY:-12}
      TELEFIRE_MEMORY_DREAM_CYCLE_BUDGET_SECONDS: ${TELEFIRE_MEMORY_DREAM_CYCLE_BUDGET_SECONDS:-50}
      TELEFIRE_MEMORY_DREAM_SCOPE_TIMEOUT_SECONDS: ${TELEFIRE_MEMORY_DREAM_SCOPE_TIMEOUT_SECONDS:-300}
      TELEFIRE_MEMORY_DREAM_CRON: ${TELEFIRE_MEMORY_DREAM_CRON:-0 * * * *}
      TELEFIRE_MEMORY_DREAM_CONCURRENCY: ${TELEFIRE_MEMORY_DREAM_CONCURRENCY:-2}
      TELEFIRE_MEMORY_DREAM_SCOPE_BATCH_SIZE: ${TELEFIRE_MEMORY_DREAM_SCOPE_BATCH_SIZE:-20}
      TELEFIRE_MEMORY_DREAM_LEASE_SECONDS: ${TELEFIRE_MEMORY_DREAM_LEASE_SECONDS:-3600}
      TELEFIRE_MEMORY_DREAM_RETRY_ATTEMPTS: ${TELEFIRE_MEMORY_DREAM_RETRY_ATTEMPTS:-3}
      TELEFIRE_MEMORY_DREAM_MAX_RETRY_DELAY: ${TELEFIRE_MEMORY_DREAM_MAX_RETRY_DELAY:-30}
      TELEFIRE_MEMORY_CONTINUOUS_POLL_SECONDS: ${TELEFIRE_MEMORY_CONTINUOUS_POLL_SECONDS:-10}
      TELEFIRE_MEMORY_CONTINUOUS_CONCURRENCY: ${TELEFIRE_MEMORY_CONTINUOUS_CONCURRENCY:-2}
      TELEFIRE_MEMORY_CONTINUOUS_SCOPE_BATCH_SIZE: ${TELEFIRE_MEMORY_CONTINUOUS_SCOPE_BATCH_SIZE:-20}
      TELEFIRE_AI_STATE_PATH: /telefire-data/.telefire/ai.db
      TELEFIRE_AI_MAX_OUTPUT_CHARS: ${TELEFIRE_AI_MAX_OUTPUT_CHARS:-3900}
      TELEFIRE_AI_EDIT_CADENCE: ${TELEFIRE_AI_EDIT_CADENCE:-4.0}
      TELEFIRE_MEMORY_COMMAND_DELETE_DELAY: ${TELEFIRE_MEMORY_COMMAND_DELETE_DELAY:-3}
      TELEFIRE_AI_SYSTEM_PROMPT: ${TELEFIRE_AI_SYSTEM_PROMPT:-}
      TELEFIRE_AI_MAX_CONTEXT_MESSAGES: ${TELEFIRE_AI_MAX_CONTEXT_MESSAGES:-20}
      TELEFIRE_AI_MAX_CONTEXT_CHARS: ${TELEFIRE_AI_MAX_CONTEXT_CHARS:-12000}
      TELEFIRE_AI_DELEGATED_COOLDOWN: ${TELEFIRE_AI_DELEGATED_COOLDOWN:-30}
    volumes:
      - telefire-runtime:/telefire-data
    networks:
      - memory-platform
      - agent-platform
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    pids_limit: 256
    restart: unless-stopped

  onebot-ai:
    build:
      context: .
    container_name: telefire-onebot-ai
    command: ["python", "-m", "telefire.cli", "onebot", "ai"]
    environment:
      PYTHONPATH: /app/src
      HOME: /telefire-data
      TELEFIRE_ONEBOT_HOST: 0.0.0.0
      TELEFIRE_ONEBOT_PORT: 8766
      TELEFIRE_ONEBOT_TOKEN: ${TELEFIRE_ONEBOT_TOKEN}
      TELEFIRE_ONEBOT_SELF_ID: ${TELEFIRE_ONEBOT_SELF_ID}
      TELEFIRE_PI_URL: http://pi-agent:8790
      TELEFIRE_PI_TOKEN: ${TELEFIRE_PI_TOKEN}
      TELEFIRE_PI_RUN_TIMEOUT: ${TELEFIRE_PI_RUN_TIMEOUT:-300}
      TELEFIRE_HINDSIGHT_URL: http://memory-api:8888
      TELEFIRE_HINDSIGHT_TIMEOUT: ${TELEFIRE_HINDSIGHT_TIMEOUT:-90}
      TELEFIRE_MEMORY_DREAM_LOOKBACK_HOURS: ${TELEFIRE_MEMORY_DREAM_LOOKBACK_HOURS:-24}
      TELEFIRE_MEMORY_DREAM_OVERLAP_SECONDS: ${TELEFIRE_MEMORY_DREAM_OVERLAP_SECONDS:-600}
      TELEFIRE_MEMORY_DREAM_SETTLEMENT_SECONDS: ${TELEFIRE_MEMORY_DREAM_SETTLEMENT_SECONDS:-30}
      TELEFIRE_MEMORY_DREAM_MAX_MESSAGES: ${TELEFIRE_MEMORY_DREAM_MAX_MESSAGES:-500}
      TELEFIRE_MEMORY_DREAM_MAX_THREAD_MESSAGES: ${TELEFIRE_MEMORY_DREAM_MAX_THREAD_MESSAGES:-100}
      TELEFIRE_MEMORY_DREAM_SESSION_IDLE_SECONDS: ${TELEFIRE_MEMORY_DREAM_SESSION_IDLE_SECONDS:-900}
      TELEFIRE_MEMORY_DREAM_SESSION_MAX_SPAN_SECONDS: ${TELEFIRE_MEMORY_DREAM_SESSION_MAX_SPAN_SECONDS:-3600}
      TELEFIRE_MEMORY_DREAM_SESSION_MAX_EVENTS: ${TELEFIRE_MEMORY_DREAM_SESSION_MAX_EVENTS:-30}
      TELEFIRE_MEMORY_DREAM_SESSION_MAX_CHARS: ${TELEFIRE_MEMORY_DREAM_SESSION_MAX_CHARS:-4000}
      TELEFIRE_MEMORY_DREAM_RETAIN_CONCURRENCY: ${TELEFIRE_MEMORY_DREAM_RETAIN_CONCURRENCY:-4}
      TELEFIRE_MEMORY_DREAM_PREPROCESS_CONCURRENCY: ${TELEFIRE_MEMORY_DREAM_PREPROCESS_CONCURRENCY:-12}
      TELEFIRE_MEMORY_DREAM_CYCLE_BUDGET_SECONDS: ${TELEFIRE_MEMORY_DREAM_CYCLE_BUDGET_SECONDS:-50}
      TELEFIRE_MEMORY_DREAM_SCOPE_TIMEOUT_SECONDS: ${TELEFIRE_MEMORY_DREAM_SCOPE_TIMEOUT_SECONDS:-300}
      TELEFIRE_MEMORY_DREAM_CRON: ${TELEFIRE_MEMORY_DREAM_CRON:-0 * * * *}
      TELEFIRE_MEMORY_DREAM_CONCURRENCY: ${TELEFIRE_MEMORY_DREAM_CONCURRENCY:-2}
      TELEFIRE_MEMORY_DREAM_SCOPE_BATCH_SIZE: ${TELEFIRE_MEMORY_DREAM_SCOPE_BATCH_SIZE:-20}
      TELEFIRE_MEMORY_DREAM_LEASE_SECONDS: ${TELEFIRE_MEMORY_DREAM_LEASE_SECONDS:-3600}
      TELEFIRE_MEMORY_DREAM_RETRY_ATTEMPTS: ${TELEFIRE_MEMORY_DREAM_RETRY_ATTEMPTS:-3}
      TELEFIRE_MEMORY_DREAM_MAX_RETRY_DELAY: ${TELEFIRE_MEMORY_DREAM_MAX_RETRY_DELAY:-30}
      TELEFIRE_MEMORY_CONTINUOUS_POLL_SECONDS: ${TELEFIRE_MEMORY_CONTINUOUS_POLL_SECONDS:-10}
      TELEFIRE_MEMORY_CONTINUOUS_CONCURRENCY: ${TELEFIRE_MEMORY_CONTINUOUS_CONCURRENCY:-2}
      TELEFIRE_MEMORY_CONTINUOUS_SCOPE_BATCH_SIZE: ${TELEFIRE_MEMORY_CONTINUOUS_SCOPE_BATCH_SIZE:-20}
      TELEFIRE_AI_STATE_PATH: /telefire-data/.telefire/onebot-ai.db
      TELEFIRE_AI_MAX_OUTPUT_CHARS: ${TELEFIRE_ONEBOT_MAX_OUTPUT_CHARS:-3900}
      TELEFIRE_MEMORY_COMMAND_DELETE_DELAY: ${TELEFIRE_MEMORY_COMMAND_DELETE_DELAY:-3}
      TELEFIRE_AI_SYSTEM_PROMPT: ${TELEFIRE_AI_SYSTEM_PROMPT:-}
      TELEFIRE_AI_MAX_CONTEXT_MESSAGES: ${TELEFIRE_AI_MAX_CONTEXT_MESSAGES:-20}
      TELEFIRE_AI_MAX_CONTEXT_CHARS: ${TELEFIRE_AI_MAX_CONTEXT_CHARS:-12000}
      TELEFIRE_AI_DELEGATED_COOLDOWN: ${TELEFIRE_AI_DELEGATED_COOLDOWN:-30}
    ports:
      - "${TELEFIRE_ONEBOT_PUBLISH_HOST:-127.0.0.1}:${TELEFIRE_ONEBOT_PUBLISH_PORT:-18867}:8766"
    volumes:
      - telefire-runtime:/telefire-data
    networks:
      - memory-platform
      - agent-platform
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8766/healthz', timeout=2).read()
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    restart: unless-stopped

volumes:
  telefire-runtime:

networks:
  memory-platform:
    external: true
    name: memory-platform
  agent-platform:
    external: true
    name: agent-platform
