services:
  memory-api:
    build:
      context: .
      dockerfile: Dockerfile.hindsight
      args:
        HINDSIGHT_CONTROL_PLANE_IMAGE: ${HINDSIGHT_CONTROL_PLANE_IMAGE:-telefire-hindsight-control-plane:0.8.4-bank-name.1}
    image: telefire-hindsight:0.8.4-bank-name.1-hardened-r1
    container_name: memory-api
    environment:
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_API_KEY: ${MEMORY_LLM_API_KEY}
      HINDSIGHT_API_LLM_MODEL: ${MEMORY_LLM_MODEL}
      HINDSIGHT_API_LLM_BASE_URL: ${MEMORY_LLM_BASE_URL}
      HINDSIGHT_API_LLM_REASONING_EFFORT: ${MEMORY_LLM_REASONING_EFFORT:-low}
      HINDSIGHT_API_LLM_TEMPERATURE: none
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${MEMORY_EMBEDDING_API_KEY:-ollama}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: ${MEMORY_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-http://ollama-embedding-ollama-1:11434/v1}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS: ${MEMORY_EMBEDDING_DIMENSIONS:-1024}
      HINDSIGHT_API_RERANKER_PROVIDER: rrf
      HINDSIGHT_API_RETAIN_ENTITY_LOOKUP: full
      HINDSIGHT_API_WORKER_ID: memory-api
      VIRTUAL_HOST: hindsight.telefire.localhost
      VIRTUAL_PORT: "9999"
    networks:
      - default
      - ollama-embedding
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${MEMORY_API_EXPOSE_PORT:-18888}:8888"
    volumes:
      - memory-data:/home/hindsight/.pg0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    pids_limit: 512
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8888/health
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  memory-data:
    name: memory-hindsight-data

networks:
  default:
    name: memory-platform
  ollama-embedding:
    external: true
    name: ollama-embedding
