[project]
name = "context-memory-inspector"
version = "0.1.0"
description = "Standalone browser inspector for Hindsight memory banks"
requires-python = ">=3.14"
dependencies = ["aiohttp>=3.14.1"]

[project.scripts]
memory-inspector = "memory_inspector.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memory_inspector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
