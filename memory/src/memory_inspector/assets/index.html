<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memory Inspector</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Memory Inspector</h1>
        <p id="service-status" class="service-status">Connecting</p>
      </div>
      <button id="refresh" type="button">Refresh</button>
    </header>
    <div class="workspace">
      <aside class="bank-panel" aria-label="Memory banks">
        <div class="panel-heading">
          <h2>Banks</h2>
          <span id="bank-count" class="count">0</span>
        </div>
        <label class="search-label" for="bank-search">Filter banks</label>
        <input id="bank-search" type="search" autocomplete="off" placeholder="Name or canonical key">
        <div id="bank-list" class="bank-list" role="listbox" aria-label="Memory banks"></div>
      </aside>
      <main class="content">
        <section id="empty-state" class="empty-state">
          <h2>Select a memory bank</h2>
        </section>
        <section id="bank-view" hidden>
          <div class="bank-header">
            <div>
              <h2 id="bank-title"></h2>
              <code id="bank-key"></code>
            </div>
            <div id="bank-health" class="status-strip"></div>
          </div>
          <div class="tabs" role="tablist" aria-label="Bank views">
            <button type="button" role="tab" data-tab="overview" aria-selected="true">Overview</button>
            <button type="button" role="tab" data-tab="episodes" aria-selected="false">Episodes</button>
            <button type="button" role="tab" data-tab="memories" aria-selected="false">Memories</button>
            <button type="button" role="tab" data-tab="entities" aria-selected="false">Entities</button>
          </div>
          <section id="tab-overview" class="tab-panel"></section>
          <section id="tab-episodes" class="tab-panel" hidden></section>
          <section id="tab-memories" class="tab-panel" hidden></section>
          <section id="tab-entities" class="tab-panel" hidden></section>
        </section>
      </main>
    </div>
    <dialog id="source-dialog">
      <div class="dialog-header">
        <div>
          <h2 id="evidence-title">Source Evidence</h2>
          <code id="source-id"></code>
        </div>
        <button id="close-source" type="button" aria-label="Close source evidence">Close</button>
      </div>
      <div id="source-content" class="source-content"></div>
    </dialog>
  </body>
</html>
