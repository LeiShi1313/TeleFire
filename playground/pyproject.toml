[project]
name = "agent-playground"
version = "0.1.0"
description = "Standalone local playground for Pi agents and Hindsight memory"
requires-python = ">=3.14"
dependencies = ["aiohttp>=3.14.1"]

[project.scripts]
agent-playground = "agent_playground.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_playground"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
