[project]
name = "telefire"
dynamic = ["version"]
description = "CLI tool for Telegram and Matrix automation"
authors = [{ name = "Lei Shi", email = "me@leishi.io" }]
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "telethon>=1.42.0",
    "fire>=0.5.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
    "openai>=2.45.0",
    "mautrix>=0.21.0",
    "Pillow>=10.0.0",
    "python-dateutil>=2.8.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
ai = ["g4f>=0.3.8"]

[project.scripts]
telefire = "telefire.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
